<!DOCTYPE html>
<html>
<head>
    <title>WebSocket Test - Wolf Server</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        #status {
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
        }
        .connected {
            background-color: #d4edda;
            color: #155724;
        }
        .disconnected {
            background-color: #f8d7da;
            color: #721c24;
        }
        .connecting {
            background-color: #fff3cd;
            color: #856404;
        }
        #messages {
            border: 1px solid #ccc;
            height: 300px;
            overflow-y: auto;
            padding: 10px;
            margin: 10px 0;
            background-color: #f9f9f9;
        }
        .message {
            margin: 5px 0;
            padding: 5px;
        }
        .sent {
            color: #0066cc;
        }
        .received {
            color: #006600;
        }
        .error {
            color: #cc0000;
        }
        input[type="text"] {
            width: 70%;
            padding: 8px;
            margin-right: 10px;
        }
        button {
            padding: 8px 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>🐺 Wolf WebSocket Test</h1>
    
    <div id="status" class="disconnected">Status: Disconnected</div>
    
    <div>
        <button id="connectBtn" onclick="connect()">Connect</button>
        <button id="disconnectBtn" onclick="disconnect()" disabled>Disconnect</button>
    </div>
    
    <h2>Messages</h2>
    <div id="messages"></div>
    
    <div>
        <input type="text" id="messageInput" placeholder="Type a message..." onkeypress="handleKeyPress(event)" disabled>
        <button onclick="sendMessage()" id="sendBtn" disabled>Send</button>
    </div>

    <script>
        let ws = null;
        const statusDiv = document.getElementById('status');
        const messagesDiv = document.getElementById('messages');
        const messageInput = document.getElementById('messageInput');
        const connectBtn = document.getElementById('connectBtn');
        const disconnectBtn = document.getElementById('disconnectBtn');
        const sendBtn = document.getElementById('sendBtn');

        function updateStatus(status, className) {
            statusDiv.textContent = 'Status: ' + status;
            statusDiv.className = className;
        }

        function addMessage(message, type) {
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message ' + type;
            msgDiv.textContent = new Date().toLocaleTimeString() + ' - ' + message;
            messagesDiv.appendChild(msgDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function connect() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                addMessage('Already connected!', 'error');
                return;
            }

            updateStatus('Connecting...', 'connecting');
            addMessage('Connecting to ws://localhost:8080', 'sent');

            try {
                ws = new WebSocket('ws://localhost:8080');

                ws.onopen = function(event) {
                    updateStatus('Connected', 'connected');
                    addMessage('Connected successfully!', 'received');
                    connectBtn.disabled = true;
                    disconnectBtn.disabled = false;
                    messageInput.disabled = false;
                    sendBtn.disabled = false;
                };

                ws.onmessage = function(event) {
                    addMessage('Received: ' + event.data, 'received');
                };

                ws.onerror = function(error) {
                    addMessage('Error: ' + (error.message || 'Unknown error'), 'error');
                    updateStatus('Error', 'disconnected');
                };

                ws.onclose = function(event) {
                    updateStatus('Disconnected', 'disconnected');
                    addMessage('Connection closed (Code: ' + event.code + ')', 'error');
                    connectBtn.disabled = false;
                    disconnectBtn.disabled = true;
                    messageInput.disabled = true;
                    sendBtn.disabled = true;
                };
            } catch (e) {
                addMessage('Exception: ' + e.message, 'error');
                updateStatus('Error', 'disconnected');
            }
        }

        function disconnect() {
            if (ws) {
                ws.close();
                ws = null;
            }
        }

        function sendMessage() {
            const message = messageInput.value.trim();
            if (!message) {
                return;
            }

            if (!ws || ws.readyState !== WebSocket.OPEN) {
                addMessage('Not connected!', 'error');
                return;
            }

            try {
                ws.send(message);
                addMessage('Sent: ' + message, 'sent');
                messageInput.value = '';
            } catch (e) {
                addMessage('Error sending: ' + e.message, 'error');
            }
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        // Auto-connect on page load
        window.onload = function() {
            addMessage('Page loaded. Click "Connect" to start.', 'received');
        };
    </script>
</body>
</html>
